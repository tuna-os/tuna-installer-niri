name: Publish Flatpak

# Build/publish body lives in tuna-os/.github's reusable publish-flatpak.yml
# (tunaos#1183 recommendation #2). This file just keeps this repo's own
# trigger policy and the pinned runtime image.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    uses: tuna-os/.github/.github/workflows/publish-flatpak.yml@main
    with:
      app-id: org.tunaos.InstallerNiri
      manifest-path: flatpak/org.tunaos.InstallerNiri.json
      repo-name: tuna-os/tuna-installer-niri
      archs: '["x86_64"]'
      flatpak-builder-image: kde-6.9
    secrets: inherit
